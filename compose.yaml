services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: learn_cache
      POSTGRES_USER: cache_lab
      POSTGRES_PASSWORD: cache_lab
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cache_lab -d learn_cache"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
